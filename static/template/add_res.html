<div class='dynamic-row res-input_{{.}}'>
  <div class='form-group flex-1'>
    <label class='form-label-sub'>Nume resursă #{{.}}</label>
    <input class='form-control text-input' type='text' placeholder='Ex: Articol PBinfo, GeeksforGeeks' name='res_{{.}}' required>
  </div>
  <div class='form-group flex-2'>
    <label class='form-label-sub'>Link URL</label>
    <input class='form-control text-input' type='url' placeholder='https://...' name='link_res_{{.}}' required>
  </div>
  <button type='button' class='btn-remove-row' onclick="this.closest('.dynamic-row').remove()" title="Șterge resursa">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>
</div>
<input class='nr_res' type='hidden' hx-post='/update_nr_res' hx-trigger='load' hx-swap='outerHTML' name='nr_res' value='{{.}}'>
