<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cO(alg)</title>

  <link href="static/css/style.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>

<body>
  <div class="header">
    <div class='align-left'>
      <div class='header-section'><a href="/">cOalg</a></div>
      <div class='header-section'><a href="/unit?clasa=9"> Clasa a 9-a</a></div>
      <div class='header-section'><a href="/unit?clasa=10"> Clasa a 10-a</a></div>
      <div class='header-section'><a href="/unit?clasa=11"> Clasa a 11-a</a></div>
    </div>
    <div class='align-right'>
      <div class='header-section' id='add_page'>
        <a href="/add-page">
          <img src="static/images/add_page.png" alt="nu e taticule">
        </a>
      </div>
      <div class='header-section' id='github'>
        <a href="https://github.com/Matei-V/Coalg">
          <img src="static/images/github-logo.png" alt="nu e taticule">
        </a>
      </div>
      <div class='header-section' id='auth'>
        <a id='authbtn' href="/login-page">
          <img src="static/images/acc-logo.png" alt="nu e taticule">
        </a>
        <div class="dropdown-content" hx-get='/auth-cont' hx-swap='outerHTML' hx-trigger='load'>
          <a href="/login-page">Login</a><br>
          <a href="/register-page">Register</a>
        </div>
      </div>
    </div>
  </div>

  <div class="main" id="main" style="position:relative; left:240px">
    <div class="separator"></div>
    <form hx-post="/add_new_page">
      <br>
      <div class="Chapter">
        <div hx-post='/load-chapters' hx-swap='outerHTML' hx-trigger='load'></div>
        <button class='button' hx-post='/add_new_chapter' hx-target='.Chapter' hx-swap='innerHTML'>Add new
          Chapter</button>
        <input type="hidden" name="add-cap" value="false">
      </div>

      <br>
      <input class='text-input' id='titlu' type="text" name="titlu" placeholder="Titlu" id="input">
      <br>
      <textarea class='text-input' id='descriere' type="text" name="descriere" placeholder="Descriere"
        id="input"></textarea>
      <br>

      <div class="Resurse">
        <input class='nr_res' type='hidden' hx-post='/update_nr_res' hx-trigger='load' hx-swap='outerHTML' name='nr_res'
          value='0'>
        <input class='button' type="button" hx-post='/add_res' hx-target='.nr_res' hx-swap='outerHTML'
          value="Adauga Resursa">
        <br>
      </div>

      <div class="Probleme">
        <input class='nr_pb' type='hidden' hx-post='/update_nr_pb' hx-trigger='load' hx-swap='outerHTML' name='nr_pb'
          value='0'>
        <input class='button' type="button" hx-post='/add_pb' hx-target='.nr_pb' hx-swap='outerHTML'
          value="Adauga Problema">
        <br>
      </div>

      <br>
      <input class='button' type="submit" value="Submit">
    </form>

  </div>

   <div class="footer">
    <div class="links">
      <h4>Link-uri utile</h4>
      <a href="/">Home</a><br>
      <a href="/unit?clasa=9">Clasa a 9-a</a><br>
      <a href="/unit?clasa=10">Clasa a 10-a</a><br>
      <a href="/unit?clasa=11">Clasa a 11-a</a><br>
      <a href="/add-page">Adaugă o pagină</a><br>
      <a href="/login-page">Login</a><br>
      <a href="/register-page">Register</a><br>
    </div>
    <div class="credit">
      <h4>Credite</h4>
      <p>Proiect realizat de Vatamanu Matei</p>
      <p><a href="http://hilite.me">hilite.me</a> pentru evidențierea secvențelor de cod.</p>
    </div>
  </div>

</body>

</html>
