<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cO(alg)</title>

  <link href="css/style.css" rel="stylesheet">
  <script>
    var menu_tog = false;

    function show_menu() {
      var menu_width = document.getElementById("menu").offsetWidth;
      console.log(menu_width);
      if (menu_tog === false) {
        document.getElementById("menu").style.left = "0px";
        document.getElementById("slider").style.left = menu_width.toString() + "px";
        document.getElementById("main").style.left = (menu_width + 30).toString() + "px";
      } else {
        document.getElementById("menu").style.left = "-" + menu_width.toString() + "px";
        document.getElementById("slider").style.left = "0px";
        document.getElementById("main").style.left = "30px";
      }
      menu_tog = !menu_tog;
    }
  </script>

  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>

<body>
  <div class="header">
    <h3>cOalg</h3>
  </div>

  <div class="menu" id="menu" hx-post='/load-menu' hx-trigger='load' hx-swap='outerHTML'>
    <div class="slider" id="slider" onclick="show_menu()">
      <div class="arrow-left"></div>
      <div class="arrow-right"></div>
    </div>
  </div>

  <div class="main" id="main" style="position:relative; left:240px">
    <div class="separator"></div>

    <div id="content">

      
    </div>


  </div>

  <div class="footer">

  </div>

</body>

</html>
